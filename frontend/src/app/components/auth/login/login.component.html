<div class="login-wrapper">
  <div class="left-panel">
    <img src="assets/illustration.png" alt="Illustration" />
  </div>
  <div class="right-panel">
    <img src="assets/logo.png" alt="Logo" class="logo" />

    <h2>Inicia sesión en tu cuenta</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input
          matInput
          type="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="togglePassword()"
        >
          <mat-icon>{{
            showPassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="full-width orange-btn"
        type="submit"
      >
        ENTRAR
      </button>

      <div class="divider">Otra forma de acceso:</div>

      <button mat-raised-button color="accent" class="full-width decathlon-btn">
        ENTRAR CON DECATHLON
      </button>

      <div class="register-link">
        ¿No tienes cuenta?
        <a href="#">Regístrate</a>
      </div>
    </form>

    <!-- <button
      mat-raised-button
      color="primary"
      (click)="loginSSO()"
      style="background-color: #3f51b5; color: white"
    >
      INICIAR SESIÓN CON SSO
    </button> -->

    <div class="footer">🌐 IDIOMA: ES</div>
  </div>
</div>
